kind = "extents"
expected = [32.0, 27.7128, 37.0]
tolerance = 0.05

[[requirements]]
id = "thread-parameters"
description = "The BOSL2 external thread has an 18 mm major diameter, 3 mm pitch, at least six pitches, and a connected overlap with the head"
