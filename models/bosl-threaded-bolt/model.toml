views = ["front", "rear", "left", "right", "isometric-front", "isometric-rear"]

[[requirements]]
id = "intended-shape"
description = "The result is one upright threaded bolt demonstrator with a chamfered hex head, connected shaft, and beveled tip"
method = "visual"
views = ["front", "rear", "left", "right", "top", "bottom", "isometric-front", "isometric-rear"]
