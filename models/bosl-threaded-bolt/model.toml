schema_version = 2
name = "bosl-threaded-bolt"
source = "model.scad"
units = "mm"

[geometry]
connected_components = 1
max_extents_mm = [270.0, 270.0, 256.0]
z0_tolerance_mm = 0.01
expected_extents_mm = [32.0, 27.7128, 37.0]
