schema_version = 2
name = "drone-course-weave-post"
source = "model.scad"
units = "mm"

[geometry]
connected_components = 1
max_extents_mm = [270.0, 270.0, 256.0]
z0_tolerance_mm = 0.01
expected_extents_mm = [70.0, 34.0, 220.0]
expected_extents_tolerance_mm = 0.05

[[requirements]]
id = "overall-size"
description = "Overall dimensions are 70 x 34 x 220 mm"
method = "mesh"
kind = "extents"
expected = [70.0, 34.0, 220.0]
tolerance = 0.05

[[requirements]]
id = "parameters"
description = "The 220 mm post, flared reinforcement, foot, and screw margins remain valid"
method = "source"

[[requirements]]
id = "mounting-holes"
description = "Both 4.5 mm mounting holes pass through the base"
method = "mesh"
kind = "region"
shape = "cylinder"
center = [-25.0, 0.0, 2.0]
radius = 2.1
height = 3.8
axis = "z"
expected = "void"
max_fraction = 0.000001

[[requirements]]
id = "left-right-symmetry"
description = "The post and mounting foot are left-right symmetric"
method = "mesh"
kind = "symmetry"
axis = "x"
offset = 0.0
max_difference_ratio = 0.000001

[[requirements]]
id = "intended-shape"
description = "One slender weave post rises from a reinforced, rounded two-hole mounting foot"
method = "visual"
views = ["front", "rear", "left", "right", "top", "bottom", "isometric-front", "isometric-rear", "isometric-underside-front", "isometric-underside-rear"]
