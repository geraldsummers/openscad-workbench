schema_version = 2
name = "drone-course-dual-target"
source = "model.scad"
units = "mm"

[geometry]
connected_components = 1
max_extents_mm = [270.0, 270.0, 256.0]
z0_tolerance_mm = 0.01
expected_extents_mm = [244.0, 32.0, 122.0]
expected_extents_tolerance_mm = 0.05

[[requirements]]
id = "overall-size"
description = "Overall dimensions are 244 x 32 x 122 mm"
method = "mesh"
kind = "extents"
expected = [244.0, 32.0, 122.0]
tolerance = 0.05

[[requirements]]
id = "parameters"
description = "The paired 96 mm targets overlap structurally while retaining a solid center bridge"
method = "source"

[[requirements]]
id = "clear-openings"
description = "Both circular target openings remain unobstructed through the frame"
method = "mesh"
kind = "region"
shape = "cylinder"
center = [-54.0, 0.0, 62.0]
radius = 47.0
height = 7.8
axis = "y"
expected = "void"
max_fraction = 0.000001

[[requirements]]
id = "mounting-holes"
description = "Both 4.5 mm mounting holes pass through the base"
method = "mesh"
kind = "region"
shape = "cylinder"
center = [-105.0, 0.0, 2.0]
radius = 2.1
height = 3.8
axis = "z"
expected = "void"
max_fraction = 0.000001

[[requirements]]
id = "left-right-symmetry"
description = "The paired targets and mounting rail are left-right symmetric"
method = "mesh"
kind = "symmetry"
axis = "x"
offset = 0.0
max_difference_ratio = 0.000001

[[requirements]]
id = "intended-shape"
description = "Two clean circular targets form one connected figure-eight frame on a mounting rail"
method = "visual"
views = ["front", "rear", "left", "right", "top", "bottom", "isometric-front", "isometric-rear", "isometric-underside-front", "isometric-underside-rear"]
