name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install system test tools
        run: sudo apt-get update && sudo apt-get install --yes shellcheck xvfb zsh

      - name: Bootstrap pinned toolchain
        run: scripts/bootstrap

      - name: Run checks
        run: scripts/check --no-doctor
